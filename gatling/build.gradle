import io.gatling.gradle.GatlingRunTask

plugins {
  id 'io.gatling.gradle' version '3.10.5'
}

repositories {
  mavenCentral()
}

gatling {
  logLevel = 'INFO'
}

dependencies {
  // The load model's arithmetic - the arrival plan, the per-second bucket rule, the record of what
  // was started - is checked rather than only measured. The tests live in the simulations' own source
  // set (see `loadModelTest` below) rather than in a `test` source set of their own, because the
  // gatling plugin loads the test source set into the simulations' classpath: a test source set that
  // depends back on the compiled simulations closes the loop
  // `compileGatlingJava -> compileTestJava -> compileGatlingJava` and gradle refuses to build it.
  // Running them over the simulations' own output is also the more honest wiring - the classes under
  // test are the classes that measure the run, not a second compilation of the same text.
  gatlingImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
  gatlingRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.register('prepareStandaloneGatling') {
  group = 'Gatling'
  description = 'Compiles Gatling simulations and writes a standalone classpath file for direct java execution.'
  dependsOn tasks.named('compileGatlingScala')
  dependsOn tasks.named('processGatlingResources')

  def outputDir = layout.buildDirectory.dir('standalone-gatling')
  outputs.dir(outputDir)

  doLast {
    def root = outputDir.get().asFile
    root.mkdirs()

    def classpathEntries = sourceSets.gatling.runtimeClasspath.files.collect { it.absolutePath }
    def classpathFile = new File(root, 'classpath.txt')
    classpathFile.text = classpathEntries.join(File.pathSeparator)
  }
}

/** JUnit 5 over the simulations' compiled output. Wired into `check`, so `./gradlew build` runs it. */
tasks.register('loadModelTest', Test) {
  group = 'verification'
  description = 'Runs the load model tests (arrival plan, per-second buckets, request-start record).'
  testClassesDirs = sourceSets.gatling.output.classesDirs
  classpath = sourceSets.gatling.runtimeClasspath
  useJUnitPlatform()
  testLogging {
    events 'passed', 'failed', 'skipped'
  }
}

tasks.named('check') {
  dependsOn tasks.named('loadModelTest')
}

def registerSimulationTask = { String taskName, String simulationPattern, String taskDescription ->
  tasks.register(taskName, GatlingRunTask) {
    group = 'Gatling'
    description = taskDescription
    simulations = {
      include simulationPattern
    }
    systemProperties = (System.properties.findAll { key, _ ->
      String name = key.toString()
      name.startsWith('perf.') || name.startsWith('gatling.')
    } + gradle.startParameter.systemPropertiesArgs.findAll { key, _ ->
      String name = key.toString()
      name.startsWith('perf.') || name.startsWith('gatling.')
    }) as Map<String, ?>
  }
}

registerSimulationTask(
    'contestSubmissionRun',
    '**/ContestSubmissionSimulation.scala',
    'Runs only ContestSubmissionSimulation.'
)

registerSimulationTask(
    'contestSubmissionStepLoadRun',
    '**/ContestSubmissionStepLoadSimulation.scala',
    'Runs only ContestSubmissionStepLoadSimulation.'
)

registerSimulationTask(
    'contestScoreboardReadRun',
    '**/ContestScoreboardReadSimulation.scala',
    'Runs only ContestScoreboardReadSimulation.'
)

registerSimulationTask(
    'ojGoalLoadRun',
    '**/OjGoalLoadSimulation.scala',
    'Runs only OjGoalLoadSimulation.'
)
