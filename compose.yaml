# Every JVM here carried -XX:MaxRAMPercentage=60 and none of them obeyed it. UseContainerSupport
# is on and /sys/fs/cgroup/memory.max reads the right limit, but under Docker Desktop on WSL2 the
# JVM still sizes from host memory: MaxRAM came back as 19.53 GiB and judge-2, in a 768M
# container, reported an 11.73 GiB maximum heap through its own actuator. The percentage was
# applied to the host figure, so it never constrained anything - lowering it to 45 would only have
# moved an 11.73 GiB ceiling to 8.79 GiB. Every OOM kill measured on this branch, both web
# instances under mixed and judge-1 three times, is that: a JVM that feels no pressure, defers
# collection, grows, and is killed by the kernel at a limit it does not know exists.
#
# MaxRAM states the limit the JVM failed to detect, which also corrects the ergonomics that read
# it. Heap is then explicit rather than a percentage, because the overhead outside it does not
# scale with the container: judge-2 measured 158M non-heap and about 132M more in thread stacks,
# GC structures and direct buffers, and that ~290M is roughly the same in a 768M container as in a
# 1280M one. A single percentage that suits web starves judge - 60% of 768M plus 290M is 98% of
# the limit. Each ceiling below leaves the measured overhead plus roughly a fifth of the container
# free. Re-measure under load before trusting them; they come from idle readings.
x-spring-build: &spring-build
  context: .
  args:
    JAR_FILE: build/libs/web-0.0.1-SNAPSHOT.jar

x-web-depends-on: &web-depends-on
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy

x-worker-depends-on: &worker-depends-on
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy

x-spring-environment: &spring-environment
  DB_HOST: mysql
  DB_PORT: 3306
  DB_NAME: oj
  DB_USER: root
  DB_PASSWORD: 1234
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-rabbitmq-environment: &rabbitmq-environment
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: oj
  RABBITMQ_PASSWORD: oj-password

x-web-healthcheck: &web-healthcheck
  test: ["CMD-SHELL", "bash -c ': >/dev/tcp/127.0.0.1/8080'"]
  interval: 10s
  timeout: 5s
  retries: 20

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "grep -aq java /proc/1/cmdline"]
  interval: 10s
  timeout: 5s
  retries: 20

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: oj-nginx
    depends_on:
      - web-1
      - web-2
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  mysql:
    image: mysql:8.0
    container_name: oj-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: oj
    command:
      - --default-authentication-plugin=mysql_native_password
      - --max_connections=500
      - --innodb_buffer_pool_size=1536M
      - --innodb_buffer_pool_instances=6
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p1234"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2560M

  redis:
    image: redis:7-alpine
    container_name: oj-redis
    command:
      - redis-server
      - --maxmemory
      - 384mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: oj-rabbitmq
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: oj
      RABBITMQ_DEFAULT_PASS: oj-password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 1024M

  web-1:
    build: *spring-build
    container_name: oj-web-1
    depends_on: *web-depends-on
    environment:
      SPRING_PROFILES_ACTIVE: ${WEB1_PROFILES:-multi-web}
      <<: *spring-environment
      CONTEST_SUBMISSION_WORKER_ID: 1
      OJ_ROLE: web
      JAVA_TOOL_OPTIONS: -XX:MaxRAM=1280m -Xmx700m
    ports:
      - "8081:8080"
    healthcheck: *web-healthcheck
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1280M

  web-2:
    build: *spring-build
    container_name: oj-web-2
    depends_on: *web-depends-on
    environment:
      SPRING_PROFILES_ACTIVE: ${WEB2_PROFILES:-multi-web}
      <<: *spring-environment
      CONTEST_SUBMISSION_WORKER_ID: 2
      OJ_ROLE: web
      JAVA_TOOL_OPTIONS: -XX:MaxRAM=1280m -Xmx700m
    ports:
      - "8082:8080"
    healthcheck: *web-healthcheck
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1280M

  batch-1:
    build: *spring-build
    container_name: oj-batch-1
    depends_on: *worker-depends-on
    environment:
      SPRING_PROFILES_ACTIVE: ${BATCH1_PROFILES:-multi-batch}
      <<: [*spring-environment, *rabbitmq-environment]
      CONTEST_SUBMISSION_WORKER_ID: 100
      OJ_ROLE: batch
      JAVA_TOOL_OPTIONS: -XX:MaxRAM=1024m -Xmx520m
    healthcheck: *worker-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 1024M

  judge-1:
    build: *spring-build
    container_name: oj-judge-1
    depends_on: *worker-depends-on
    environment:
      SPRING_PROFILES_ACTIVE: ${JUDGE1_PROFILES:-multi-judge}
      <<: [*spring-environment, *rabbitmq-environment]
      CONTEST_SUBMISSION_WORKER_ID: 200
      OJ_ROLE: judge
      JAVA_TOOL_OPTIONS: -XX:MaxRAM=768m -Xmx320m
    healthcheck: *worker-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

  judge-2:
    build: *spring-build
    container_name: oj-judge-2
    depends_on: *worker-depends-on
    environment:
      SPRING_PROFILES_ACTIVE: ${JUDGE2_PROFILES:-multi-judge}
      <<: [*spring-environment, *rabbitmq-environment]
      CONTEST_SUBMISSION_WORKER_ID: 201
      OJ_ROLE: judge
      JAVA_TOOL_OPTIONS: -XX:MaxRAM=768m -Xmx320m
    healthcheck: *worker-healthcheck
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data:
