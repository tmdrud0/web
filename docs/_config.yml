title: "Kim's Engineering Notes"
description: "성능 최적화와 서비스 설계를 기록하는 GitHub Pages 블로그"
lang: "ko-KR"
timezone: "Asia/Seoul"
url: "https://tmdrud0.github.io"
baseurl: "/web"
