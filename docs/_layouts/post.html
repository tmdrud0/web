---
layout: default
---

<article class="post-layout">
  <header class="post-header">
    <p class="eyebrow">{{ page.date | date: "%Y.%m.%d" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p class="post-lead">{{ page.description }}</p>
    {% endif %}
    {% if page.tags %}
      <p class="tag-row">
        {% for tag in page.tags %}
          <span>#{{ tag }}</span>
        {% endfor %}
      </p>
    {% endif %}
  </header>
  <div class="post-body">
    {{ content }}
  </div>
</article>
