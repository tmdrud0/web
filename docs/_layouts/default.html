<!doctype html>
<html lang="{{ site.lang | default: 'ko-KR' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <div class="page-shell">
      <div class="background-orb orb-one"></div>
      <div class="background-orb orb-two"></div>
      <header class="site-header">
        <a class="brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark">K</span>
          <span class="brand-copy">
            <strong>{{ site.title }}</strong>
            <span>{{ site.description }}</span>
          </span>
        </a>
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}">Posts</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a href="https://github.com/tmdrud0/web">Repository</a>
        </nav>
      </header>
      <main class="page-content">
        {{ content }}
      </main>
      <footer class="site-footer">
        <p>{{ site.title }} · Built for GitHub Pages</p>
      </footer>
    </div>
  </body>
</html>
