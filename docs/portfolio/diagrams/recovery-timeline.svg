<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="100%" role="img" aria-label="Redis RDB 롤백 복구 흐름 비교">
  <style>
    .bx    { rx: 7; stroke-width: 1.5; }
    .app   { fill: #f1f5f9; stroke: #64748b; }
    .sql   { fill: #eff6ff; stroke: #2563eb; }
    .redis { fill: #fef2f2; stroke: #dc2626; }
    .mq    { fill: #f5f3ff; stroke: #7c3aed; }
    .t     { font-family: 'Malgun Gothic','Segoe UI',sans-serif; fill: #1e293b; }
    .ttl   { font-size: 12px; font-weight: 700; }
    .sub   { font-size: 10.5px; fill: #475569; }
    .cap   { font-size: 11px; font-weight: 700; fill: #64748b; letter-spacing: .05em; }
    .chip  { font-size: 12.5px; font-weight: 700; fill: #ffffff; }
    .ln    { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .time  { font-size: 15px; font-weight: 700; }
  </style>
  <defs>
    <marker id="a5" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="470" fill="#ffffff"/>

  <!-- 실험 절차 -->
  <rect x="24" y="20" width="852" height="86" rx="9" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="42" y="42" class="t cap">실험 절차 — 일관된 RDB 롤백</text>
  <text x="42" y="63" class="t sub">① batch consumer 정지 → SAVE로 시점 K 보존   ② 새 제출 tail을 완전히 적용한 시점 N의 scoreboard SHA-256 digest 기록</text>
  <text x="42" y="82" class="t sub">③ Redis SIGKILL 후 K의 RDB로 되돌림   ④ checkpoint와 digest가 N으로 돌아올 때까지 500ms마다 확인</text>
  <text x="42" y="99" class="t sub" fill="#b91c1c">일부 key만 지우는 시험이 아니라 scoreboard와 checkpoint가 함께 되감기는 롤백이다. 롤백된 tail은 약 90건.</text>

  <!-- ===== outbox ===== -->
  <rect x="24" y="140" width="86" height="28" rx="6" fill="#94a3b8"/>
  <text x="67" y="159" class="t chip" text-anchor="middle">outbox</text>

  <rect x="130" y="132" width="170" height="52" class="bx redis"/>
  <text x="215" y="154" class="t ttl" text-anchor="middle">Redis가 K로 롤백</text>
  <text x="215" y="171" class="t sub" text-anchor="middle">DB checkpoint는 그대로</text>

  <rect x="326" y="132" width="170" height="52" class="bx app"/>
  <text x="411" y="154" class="t ttl" text-anchor="middle">recovery scan</text>
  <text x="411" y="171" class="t sub" text-anchor="middle">5초 주기 · 10행</text>

  <rect x="522" y="132" width="170" height="52" class="bx sql"/>
  <text x="607" y="154" class="t ttl" text-anchor="middle">어긋남 탐지</text>
  <text x="607" y="171" class="t sub" text-anchor="middle">lost-tail · duplicate seq</text>

  <rect x="718" y="132" width="158" height="52" class="bx sql"/>
  <text x="797" y="154" class="t ttl" text-anchor="middle">DB requeue</text>
  <text x="797" y="171" class="t sub" text-anchor="middle">→ Lua 재적용</text>

  <line x1="300" y1="158" x2="320" y2="158" class="ln" marker-end="url(#a5)"/>
  <line x1="496" y1="158" x2="516" y2="158" class="ln" marker-end="url(#a5)"/>
  <line x1="692" y1="158" x2="712" y2="158" class="ln" marker-end="url(#a5)"/>

  <text x="130" y="212" class="t time" fill="#c2410c">30.954s</text>
  <text x="216" y="212" class="t sub">— 어긋남을 "찾아야" 하고, 5초 스캔 주기가 복구 시간의 하한을 만든다</text>

  <line x1="24" y1="234" x2="876" y2="234" stroke="#e2e8f0"/>

  <!-- ===== stream ===== -->
  <rect x="24" y="272" width="86" height="28" rx="6" fill="#0f766e"/>
  <text x="67" y="291" class="t chip" text-anchor="middle">stream</text>

  <rect x="130" y="264" width="222" height="52" class="bx redis"/>
  <text x="241" y="286" class="t ttl" text-anchor="middle">상태 + offset이 함께 K로 롤백</text>
  <text x="241" y="303" class="t sub" text-anchor="middle">같은 스냅샷 경계를 공유</text>

  <rect x="378" y="264" width="222" height="52" class="bx app"/>
  <text x="489" y="286" class="t ttl" text-anchor="middle">consumer가 offset 역행 감지</text>
  <text x="489" y="303" class="t sub" text-anchor="middle">메모리의 마지막 offset과 비교</text>

  <rect x="626" y="264" width="250" height="52" class="bx mq"/>
  <text x="751" y="286" class="t ttl" text-anchor="middle">x-stream-offset = K+1 재구독</text>
  <text x="751" y="303" class="t sub" text-anchor="middle">stream에서 직접 replay</text>

  <line x1="352" y1="290" x2="372" y2="290" class="ln" marker-end="url(#a5)"/>
  <line x1="600" y1="290" x2="620" y2="290" class="ln" marker-end="url(#a5)"/>

  <text x="130" y="344" class="t time" fill="#0f766e">2.038s / 2.533s</text>
  <text x="272" y="344" class="t sub">— 되감긴 offset 자체가 재시작점이므로 탐지 단계가 없다</text>

  <!-- 판정 한계 -->
  <rect x="24" y="368" width="852" height="82" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="42" y="392" class="t ttl" fill="#9a3412">이 시간 차이를 성능 배수로 인용하지 않는다</text>
  <text x="42" y="413" class="t sub">outbox 복구는 시간 절약을 위해 축소된 기준점(참가자 30명 · 73 results)을 사용했고, 이는 outbox에 유리한 조건이다.</text>
  <text x="42" y="431" class="t sub">stream 두 실행도 의미 상태 수렴 뒤 Docker health 회복 전에 검사한 harness 문제로 최종 게이트가 FAIL이라 수렴 상한 관찰값이다.</text>
  <text x="42" y="449" class="t sub" fill="#9a3412">드러나는 것은 시간이 아니라 제어 흐름의 복잡도 차이다 — 한쪽은 탐지가 필요하고, 다른 쪽은 필요 없다.</text>
</svg>
