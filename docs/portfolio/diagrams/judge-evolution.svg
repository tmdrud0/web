<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" width="100%" role="img" aria-label="채점 구조의 변화: V0에서 현재까지">
  <style>
    .bx    { rx: 7; stroke-width: 1.5; }
    .app   { fill: #f1f5f9; stroke: #64748b; }
    .sql   { fill: #eff6ff; stroke: #2563eb; }
    .mq    { fill: #f5f3ff; stroke: #7c3aed; }
    .vol   { fill: #fffbeb; stroke: #d97706; stroke-dasharray: 4 3; }
    .t     { font-family: 'Malgun Gothic','Segoe UI',sans-serif; fill: #1e293b; }
    .ttl   { font-size: 12.5px; font-weight: 700; }
    .sub   { font-size: 10.5px; fill: #475569; }
    .chip  { font-size: 13px; font-weight: 700; fill: #ffffff; }
    .bad   { font-size: 11.5px; fill: #c2410c; }
    .good  { font-size: 11.5px; fill: #0f766e; font-weight: 700; }
    .ln    { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .rule  { stroke: #e2e8f0; stroke-width: 1; }
  </style>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="900" height="580" fill="#ffffff"/>

  <!-- ================= V0 ================= -->
  <rect x="24" y="52" width="72" height="28" rx="6" fill="#94a3b8"/>
  <text x="60" y="71" class="t chip" text-anchor="middle">V0</text>

  <rect x="116" y="40" width="150" height="46" class="bx sql"/>
  <text x="191" y="61" class="t ttl" text-anchor="middle">HTTP 저장</text>
  <text x="191" y="77" class="t sub" text-anchor="middle">commit</text>

  <rect x="298" y="40" width="160" height="46" class="bx vol"/>
  <text x="378" y="61" class="t ttl" text-anchor="middle">Spring event</text>
  <text x="378" y="77" class="t sub" text-anchor="middle">JVM 메모리</text>

  <rect x="490" y="40" width="160" height="46" class="bx app"/>
  <text x="570" y="68" class="t ttl" text-anchor="middle">async listener</text>

  <rect x="682" y="40" width="150" height="46" class="bx app"/>
  <text x="757" y="68" class="t ttl" text-anchor="middle">채점 API (건별)</text>

  <line x1="266" y1="63" x2="292" y2="63" class="ln" marker-end="url(#a2)"/>
  <line x1="458" y1="63" x2="484" y2="63" class="ln" marker-end="url(#a2)"/>
  <line x1="650" y1="63" x2="676" y2="63" class="ln" marker-end="url(#a2)"/>

  <text x="116" y="108" class="t bad">✕ commit 후 listener 실행 전에 죽으면 그 제출은 영원히 채점되지 않는다 — 복구 지점이 없음</text>
  <line x1="24" y1="126" x2="876" y2="126" class="rule"/>

  <!-- ================= V2 ================= -->
  <rect x="24" y="176" width="72" height="28" rx="6" fill="#94a3b8"/>
  <text x="60" y="195" class="t chip" text-anchor="middle">V2</text>

  <rect x="116" y="164" width="180" height="46" class="bx sql"/>
  <text x="206" y="185" class="t ttl" text-anchor="middle">SKIP LOCKED claim</text>
  <text x="206" y="201" class="t sub" text-anchor="middle">여러 건 선점</text>

  <rect x="336" y="152" width="330" height="70" rx="9" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="350" y="171" class="t ttl" fill="#9a3412">하나의 긴 트랜잭션</text>
  <text x="350" y="190" class="t sub">병렬 채점 · 결과 batch 저장 · 커넥션 점유</text>
  <text x="350" y="208" class="t sub">99건 × 10ms + 1건 × 2초 → 전체 2초</text>

  <rect x="706" y="164" width="150" height="46" class="bx sql"/>
  <text x="781" y="192" class="t ttl" text-anchor="middle">결과 commit</text>

  <line x1="296" y1="187" x2="330" y2="187" class="ln" marker-end="url(#a2)"/>
  <line x1="666" y1="187" x2="700" y2="187" class="ln" marker-end="url(#a2)"/>

  <text x="116" y="244" class="t bad">✕ 외부 API를 트랜잭션 안에서 호출 — 느린 한 건이 나머지 결과 commit까지 막는다 (head-of-line blocking)</text>
  <line x1="24" y1="262" x2="876" y2="262" class="rule"/>

  <!-- ================= V3 ================= -->
  <rect x="24" y="312" width="72" height="28" rx="6" fill="#94a3b8"/>
  <text x="60" y="331" class="t chip" text-anchor="middle">V3</text>

  <rect x="116" y="300" width="160" height="46" class="bx sql"/>
  <text x="196" y="321" class="t ttl" text-anchor="middle">짧은 claim</text>
  <text x="196" y="337" class="t sub" text-anchor="middle">token · claimed_at</text>

  <rect x="308" y="300" width="180" height="46" class="bx vol"/>
  <text x="398" y="321" class="t ttl" text-anchor="middle">메모리 큐 + worker</text>
  <text x="398" y="337" class="t sub" text-anchor="middle">채점 (트랜잭션 밖)</text>

  <rect x="520" y="300" width="160" height="46" class="bx sql"/>
  <text x="600" y="328" class="t ttl" text-anchor="middle">결과 batch 저장</text>

  <rect x="712" y="300" width="144" height="46" class="bx app"/>
  <text x="784" y="321" class="t ttl" text-anchor="middle">sweeper</text>
  <text x="784" y="337" class="t sub" text-anchor="middle">오래된 claim 회수</text>

  <line x1="276" y1="323" x2="302" y2="323" class="ln" marker-end="url(#a2)"/>
  <line x1="488" y1="323" x2="514" y2="323" class="ln" marker-end="url(#a2)"/>
  <path d="M784,300 L784,286 L196,286 L196,296" class="ln" stroke-dasharray="4 3" marker-end="url(#a2)"/>

  <text x="116" y="380" class="t bad">✕ 격리는 해결됐지만 claim timeout · heartbeat · lease · in-flight를 직접 구현하고 관찰해야 함 — 정할 근거가 없었다</text>
  <line x1="24" y1="398" x2="876" y2="398" class="rule"/>

  <!-- ================= 현재 ================= -->
  <rect x="24" y="448" width="72" height="28" rx="6" fill="#0f766e"/>
  <text x="60" y="467" class="t chip" text-anchor="middle">현재</text>

  <rect x="116" y="436" width="160" height="46" class="bx sql"/>
  <text x="196" y="457" class="t ttl" text-anchor="middle">judge outbox</text>
  <text x="196" y="473" class="t sub" text-anchor="middle">제출과 같은 트랜잭션</text>

  <rect x="308" y="436" width="170" height="46" class="bx mq"/>
  <text x="393" y="457" class="t ttl" text-anchor="middle">quorum queue</text>
  <text x="393" y="473" class="t sub" text-anchor="middle">prefetch = 1</text>

  <rect x="510" y="436" width="150" height="46" class="bx app"/>
  <text x="585" y="457" class="t ttl" text-anchor="middle">Judge ×2</text>
  <text x="585" y="473" class="t sub" text-anchor="middle">동시성 16</text>

  <rect x="692" y="436" width="164" height="46" class="bx sql"/>
  <text x="774" y="457" class="t ttl" text-anchor="middle">결과 commit</text>
  <text x="774" y="473" class="t sub" text-anchor="middle">→ confirm → ACK</text>

  <line x1="276" y1="459" x2="302" y2="459" class="ln" marker-end="url(#a2)"/>
  <line x1="478" y1="459" x2="504" y2="459" class="ln" marker-end="url(#a2)"/>
  <line x1="660" y1="459" x2="686" y2="459" class="ln" marker-end="url(#a2)"/>

  <text x="116" y="516" class="t good">✓ 재전달 · in-flight 제한 · retry · DLQ를 broker가 담당 — 직접 만든 claim 관리 코드가 사라짐</text>
  <text x="116" y="538" class="t bad">△ 남는 비용: outbox → Rabbit은 at-least-once. 중복은 submission ID 멱등 처리로 흡수한다</text>
</svg>
