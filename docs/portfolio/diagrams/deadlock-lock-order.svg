<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" role="img" aria-label="데드락 세 번과 각각 락 순서를 정한 층">
  <style>
    .bx   { rx: 7; stroke-width: 1.5; }
    .sql  { fill: #eff6ff; stroke: #2563eb; }
    .warn { fill: #fff7ed; stroke: #ea580c; }
    .ok   { fill: #f0fdfa; stroke: #0f766e; }
    .t    { font-family: 'Malgun Gothic','Segoe UI',sans-serif; fill: #1e293b; }
    .ttl  { font-size: 13px; font-weight: 700; }
    .sub  { font-size: 11px; fill: #475569; }
    .mono { font-family: Consolas,'Courier New',monospace; font-size: 10.5px; fill: #334155; }
    .tag  { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; }
    .ln   { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    .cross{ stroke: #ea580c; stroke-width: 1.6; fill: none; stroke-dasharray: 5 3; }
    .fix  { font-size: 11px; fill: #0f766e; font-weight: 700; }
    .cap  { font-size: 11px; fill: #64748b; }
  </style>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#94a3b8"/>
    </marker>
    <marker id="ao" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect width="900" height="560" fill="#ffffff"/>

  <text x="24" y="26" class="t ttl" font-size="14">세 번 모두 "락 순서" 문제였지만, 순서를 정한 것은 매번 달랐다</text>
  <text x="24" y="44" class="t cap">왼쪽이 두 트랜잭션이 실제로 잠근 순서 · 주황 점선이 교차 대기 · 오른쪽이 고친 지점</text>

  <!-- ================= ① 격리 수준 ================= -->
  <text x="24" y="86" class="t tag" fill="#ea580c">① 격리 수준</text>
  <text x="122" y="86" class="t sub">REPEATABLE READ 에서 gap 락이 레코드 락보다 먼저 잡힌다</text>

  <rect x="24" y="98" width="250" height="52" class="bx warn"/>
  <text x="38" y="118" class="t ttl" font-size="12">TX A · claim UPDATE</text>
  <text x="38" y="136" class="t mono">gap lock  →  record lock</text>

  <rect x="24" y="164" width="250" height="52" class="bx warn"/>
  <text x="38" y="184" class="t ttl" font-size="12">TX B · INSERT</text>
  <text x="38" y="202" class="t mono">record lock  →  gap lock</text>

  <path d="M282,124 C314,124 314,190 282,190" class="cross" marker-end="url(#ao)"/>
  <path d="M282,190 C314,190 314,124 282,124" class="cross" marker-end="url(#ao)"/>
  <text x="326" y="152" class="t sub" fill="#ea580c">방향이 반대라 교차</text>

  <line x1="470" y1="157" x2="516" y2="157" class="ln" marker-end="url(#a)"/>
  <rect x="524" y="122" width="352" height="70" class="bx ok"/>
  <text x="540" y="143" class="t fix">READ COMMITTED 로 낮춘다</text>
  <text x="540" y="163" class="t sub">claim UPDATE 가 gap 락을 잡지 않는다.</text>
  <text x="540" y="180" class="t sub">id 가 1씩 증가해도 순서는 격리 수준이 정했다.</text>

  <!-- ================= ② 잠금 진입점 ================= -->
  <line x1="24" y1="238" x2="876" y2="238" stroke="#e2e8f0" stroke-width="1"/>

  <text x="24" y="266" class="t tag" fill="#ea580c">② 잠금 진입점</text>
  <text x="122" y="266" class="t sub">ORDER BY 로 대상 순서를 맞춰도, 어디서부터 타는지가 다르다</text>

  <rect x="24" y="278" width="250" height="52" class="bx warn"/>
  <text x="38" y="298" class="t ttl" font-size="12">회수 UPDATE … WHERE status</text>
  <text x="38" y="316" class="t mono">secondary idx  →  PK</text>

  <rect x="24" y="344" width="250" height="52" class="bx warn"/>
  <text x="38" y="364" class="t ttl" font-size="12">완료 UPDATE … WHERE id</text>
  <text x="38" y="382" class="t mono">PK  →  secondary idx</text>

  <path d="M282,304 C314,304 314,370 282,370" class="cross" marker-end="url(#ao)"/>
  <path d="M282,370 C314,370 314,304 282,304" class="cross" marker-end="url(#ao)"/>
  <text x="326" y="332" class="t sub" fill="#ea580c">정렬과 무관하게 교차</text>

  <line x1="470" y1="337" x2="516" y2="337" class="ln" marker-end="url(#a)"/>
  <rect x="524" y="292" width="352" height="90" class="bx ok"/>
  <text x="540" y="313" class="t fix">진입점을 하나로 — 먼저 고르고, id 로만 UPDATE</text>
  <text x="540" y="333" class="t mono">SELECT … FOR UPDATE SKIP LOCKED</text>
  <text x="540" y="351" class="t mono">UPDATE … WHERE id = ?</text>
  <text x="540" y="371" class="t sub">지금 relay 의 outbox claim 이 이 형태다.</text>

  <!-- ================= ③ 인덱스 ================= -->
  <line x1="24" y1="418" x2="876" y2="418" stroke="#e2e8f0" stroke-width="1"/>

  <text x="24" y="446" class="t tag" fill="#ea580c">③ 인덱스</text>
  <text x="122" y="446" class="t sub">UPDATE 가 건드리는 보조 인덱스끼리 교차한다 — 쿼리문에 적혀 있지 않다</text>

  <rect x="24" y="458" width="250" height="40" class="bx sql"/>
  <text x="38" y="482" class="t mono">(status, claimed_at, id) 보유</text>

  <rect x="24" y="506" width="250" height="40" class="bx sql"/>
  <text x="38" y="530" class="t mono">(status, id) 보유</text>

  <path d="M282,478 C314,478 314,526 282,526" class="cross" marker-end="url(#ao)"/>
  <path d="M282,526 C314,526 314,478 282,478" class="cross" marker-end="url(#ao)"/>
  <text x="326" y="506" class="t sub" fill="#ea580c">서로 상대를 기다림</text>

  <line x1="470" y1="502" x2="516" y2="502" class="ln" marker-end="url(#a)"/>
  <rect x="524" y="466" width="352" height="72" class="bx ok"/>
  <text x="540" y="487" class="t fix">(status, id) 를 지운다</text>
  <text x="540" y="507" class="t sub">쿼리 패턴에는 앞의 하나면 충분했다.</text>
  <text x="540" y="524" class="t sub">더해서가 아니라 빼서 고친 경우다.</text>
</svg>
