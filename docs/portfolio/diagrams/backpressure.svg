<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" width="100%" role="img" aria-label="과부하가 쌓이는 위치와 영속성 경계">
  <style>
    .bx    { rx: 7; stroke-width: 1.5; }
    .vol   { fill: #fff7ed; stroke: #ea580c; stroke-dasharray: 5 3; }
    .dur   { fill: #eff6ff; stroke: #2563eb; }
    .mq    { fill: #f5f3ff; stroke: #7c3aed; }
    .dlq   { fill: #fef2f2; stroke: #b91c1c; }
    .t     { font-family: 'Malgun Gothic','Segoe UI',sans-serif; fill: #1e293b; }
    .ttl   { font-size: 12px; font-weight: 700; }
    .sub   { font-size: 10.5px; fill: #475569; }
    .cap   { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
    .ln    { stroke: #94a3b8; stroke-width: 1.6; fill: none; }
  </style>
  <defs>
    <marker id="a6" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#94a3b8"/>
    </marker>
    <marker id="a6r" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto">
      <path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#b91c1c"/>
    </marker>
  </defs>

  <rect width="900" height="490" fill="#ffffff"/>

  <!-- 영역 배경 -->
  <rect x="0" y="44"  width="900" height="178" fill="#fffbf5"/>
  <rect x="0" y="222" width="900" height="230" fill="#f7fafd"/>

  <!-- 비영속 영역 -->
  <text x="24" y="34" class="t cap" fill="#c2410c">비영속 — 프로세스가 죽으면 유실된다</text>
  <text x="24" y="74" class="t sub" fill="#9a3412">유실을 없애는 대신, 유실 가능 범위의 상한을 설정값으로 고정했다.</text>

  <rect x="40" y="92" width="190" height="66" class="bx vol"/>
  <text x="135" y="114" class="t ttl" text-anchor="middle">bulk writer 큐</text>
  <text x="135" y="132" class="t sub" text-anchor="middle">+ admission semaphore</text>
  <text x="135" y="149" class="t sub" text-anchor="middle" fill="#c2410c">초과 시 HTTP 503 + Retry-After</text>

  <rect x="266" y="92" width="190" height="66" class="bx vol"/>
  <text x="361" y="114" class="t ttl" text-anchor="middle">completion executor</text>
  <text x="361" y="132" class="t sub" text-anchor="middle">4 threads · queue 64</text>
  <text x="361" y="149" class="t sub" text-anchor="middle" fill="#c2410c">가득 차면 CallerRuns가 역압</text>

  <line x1="230" y1="125" x2="260" y2="125" class="ln" marker-end="url(#a6)"/>

  <!-- 경계선 -->
  <line x1="24" y1="222" x2="876" y2="222" stroke="#0f172a" stroke-width="2" stroke-dasharray="9 5"/>
  <rect x="596" y="208" width="204" height="28" rx="14" fill="#0f172a"/>
  <text x="698" y="227" class="t cap" fill="#ffffff" text-anchor="middle">영속성 경계 — DB commit</text>

  <!-- 경계를 넘는 화살표 -->
  <path d="M361,158 L361,238 L150,238 L150,248" class="ln" stroke="#0f766e" stroke-width="2" marker-end="url(#a6)"/>
  <text x="374" y="196" class="t ttl" fill="#0f766e">commit</text>

  <!-- 영속 단계 : 왼쪽에서 오른쪽으로 -->
  <rect x="60" y="250" width="180" height="66" class="bx dur"/>
  <text x="150" y="272" class="t ttl" text-anchor="middle">judge outbox</text>
  <text x="150" y="290" class="t sub" text-anchor="middle">MySQL PENDING rows</text>
  <text x="150" y="307" class="t sub" text-anchor="middle">DB 용량까지 축적</text>

  <rect x="290" y="250" width="180" height="66" class="bx mq"/>
  <text x="380" y="272" class="t ttl" text-anchor="middle">quorum queue</text>
  <text x="380" y="290" class="t sub" text-anchor="middle">ready messages</text>
  <text x="380" y="307" class="t sub" text-anchor="middle">unacked 최대 32</text>

  <rect x="520" y="250" width="180" height="66" class="bx mq"/>
  <text x="610" y="272" class="t ttl" text-anchor="middle">stream pending</text>
  <text x="610" y="290" class="t sub" text-anchor="middle">tail offset − 적용 offset</text>
  <text x="610" y="307" class="t sub" text-anchor="middle">retention 범위까지</text>

  <line x1="240" y1="283" x2="284" y2="283" class="ln" marker-end="url(#a6)"/>
  <line x1="470" y1="283" x2="514" y2="283" class="ln" marker-end="url(#a6)"/>

  <!-- 실패 분기 -->
  <path d="M380,316 L380,346" fill="none" stroke="#b91c1c" stroke-width="1.5"
        stroke-dasharray="5 3" marker-end="url(#a6r)"/>
  <text x="394" y="338" class="t sub" fill="#b91c1c">retry 3회 소진</text>

  <rect x="290" y="352" width="180" height="62" class="bx dlq"/>
  <text x="380" y="374" class="t ttl" text-anchor="middle" fill="#991b1b">dead-letter queue</text>
  <text x="380" y="392" class="t sub" text-anchor="middle">운영자가 재처리·폐기할</text>
  <text x="380" y="408" class="t sub" text-anchor="middle">때까지 계속 증가</text>

  <text x="24" y="440" class="t cap" fill="#1d4ed8">영속 — 재시작하면 이어서 처리된다</text>

  <!-- 검증 메모 -->
  <text x="24" y="474" class="t sub">검증: <tspan font-weight="700">max-in-flight=800</tspan> 기준선에서 정확히 상한에서 멈췄고, 거부된 제출 수와 HTTP 503 수가 일치했다.</text>
</svg>
