contest.outbox.scheduler.enabled=false
rank.streak.batch.enabled=false
contest.submission.judge.rabbit.publisher.enabled=false
contest.submission.judge.rabbit.listener.enabled=true
contest.submission.judge.result-stream.publisher.enabled=true
contest.scoreboard.stream.consumer.enabled=false
# See application-web-role.properties: the outbox backlog is read by batch-1 alone.
contest.outbox.metrics.enabled=false
# A judge node calls an external judging server and waits on it (OJ_DESIGN_NOTES 230), so these
# threads are blocked on a socket rather than computing, and 0.75 CPU can carry many of them.
# Sixty-four was still more than this container is: at 1MB of reserved stack each that is most of
# the ~140M that sits between the JVM's own footprint and the 768M limit, on a node that was
# OOM-killed three times, and it assumes a judging server willing to take 128 calls at once from
# two nodes. Sixteen keeps the isolation the design wants - prefetch=1 across many consumers, so
# one slow judgement blocks one thread - without claiming a judging farm nobody has measured.
#
# Concurrency times instances divided by mean judge latency is the pipeline's drain rate, so this
# is the number that decides how fast a backlog clears: 32 concurrent at 147.5ms (50ms base, 5% at
# 2s) is about 217 submissions a second, against 868 at sixty-four.
spring.rabbitmq.listener.simple.concurrency=${CONTEST_JUDGE_CONCURRENCY:16}
spring.rabbitmq.listener.simple.max-concurrency=${CONTEST_JUDGE_CONCURRENCY:16}
contest.submission.judge.result-writer.batch-size=32
contest.submission.judge.result-writer.worker-count=1
contest.submission.judge.result-writer.queue-capacity=512
contest.submission.judge.result-writer.max-wait=5ms

# See application-batch-role.properties: management port only, no business connector.
server.port=-1
