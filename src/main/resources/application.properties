spring.application.name=web

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:oj}?rewriteBatchedStatements=true&cachePrepStmts=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:oj}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:oj-password}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.concurrency=${CONTEST_JUDGE_CONCURRENCY:16}
spring.rabbitmq.listener.simple.max-concurrency=${CONTEST_JUDGE_MAX_CONCURRENCY:16}
spring.rabbitmq.listener.simple.prefetch=${CONTEST_JUDGE_PREFETCH:1}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=3
spring.rabbitmq.listener.simple.retry.max-interval=10s

spring.profiles.group.perf-triple[0]=perf
spring.profiles.group.perf-triple[1]=perf-triple-writes
spring.profiles.group.rank-bench[0]=perf
spring.profiles.group.rank-bench[1]=rank-bench
spring.profiles.group.multi-web[0]=multi-server
spring.profiles.group.multi-web[1]=web-role
spring.profiles.group.multi-batch[0]=multi-server
spring.profiles.group.multi-batch[1]=batch-role
spring.profiles.group.multi-judge[0]=multi-server
spring.profiles.group.multi-judge[1]=judge-role

contest.outbox.scheduler.enabled=true
rank.streak.batch.enabled=true
contest.submission.judge.rabbit.publisher.enabled=true
contest.submission.judge.rabbit.listener.enabled=true
contest.submission.judge.rabbit.publisher.batch-size=200
contest.submission.judge.rabbit.publisher.poll-interval-ms=100
contest.submission.judge.rabbit.publisher.claim-timeout=30s
contest.submission.id.strategy=simple
contest.submission.id.epoch-millis=1704067200000
contest.submission.id.worker-id=${CONTEST_SUBMISSION_WORKER_ID:0}

# Let Flyway manage the schema; JPA validates mapping
spring.jpa.hibernate.ddl-auto=validate

# Flyway configuration
spring.flyway.enabled=true
# Default locations: classpath:db/migration
# Uncomment the next line if adopting into a non-empty DB to baseline existing schema
# spring.flyway.baseline-on-migrate=true

spring.jpa.show-sql=true
# ???? ?? SQL ???
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true
contest.submission.async.core-pool-size=2
contest.submission.async.max-pool-size=4
contest.submission.async.queue-capacity=1000
contest.submission.completion.thread-count=8
contest.submission.completion.queue-capacity=256

# Hibernate ???? ???? SQL ?? ?? ?? ??
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

