spring.application.name=web

spring.datasource.url=jdbc:mysql://localhost:3306/oj
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Let Flyway manage the schema; JPA validates mapping
spring.jpa.hibernate.ddl-auto=validate

# Flyway configuration
spring.flyway.enabled=true
# Default locations: classpath:db/migration
# Uncomment the next line if adopting into a non-empty DB to baseline existing schema
# spring.flyway.baseline-on-migrate=true

spring.jpa.show-sql=true
# ???? ?? SQL ???
spring.jpa.properties.hibernate.format_sql=true

# Hibernate ???? ???? SQL ?? ?? ?? ??
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

