# redis-seq recovery delivered by the MySQL poller, with no scoreboard RabbitMQ Stream on any role.
# Add it after a role profile, e.g. spring.profiles.active=multi-batch,redis-seq-poll: being activated
# last, it overrides the Stream flags the role files turn on. The judge work queue is unaffected.
#
# The poller runs only on the instance with contest.scoreboard.recovery.owner.enabled=true (batch-role),
# and a MySQL named lock makes a second owner stand down instead of polling beside it.
contest.scoreboard.recovery.mode=redis-seq
contest.scoreboard.delivery=mysql-poll
contest.scoreboard.stream.consumer.enabled=false
contest.submission.judge.result-stream.publisher.enabled=false
