# Dedicated perf database (oj -> oj_perf)
spring.datasource.url=jdbc:mysql://localhost:3306/oj_perf?rewriteBatchedStatements=true&cachePrepStmts=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=20
spring.jpa.open-in-view=false
contest.scoreboard.store=memory
contest.submission.dedup.store=memory
contest.submission.rate-limit.store=none
contest.submission.post-process.enabled=false
contest.submission.judge.rabbit.publisher.enabled=false
contest.submission.judge.rabbit.listener.enabled=false
contest.submission.bulk.worker-count=4
contest.submission.async.core-pool-size=10
contest.submission.async.max-pool-size=10
contest.submission.async.queue-capacity=2000

# Reduce SQL and JDBC chatter during large seeding runs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
