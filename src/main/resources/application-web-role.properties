contest.outbox.scheduler.enabled=false
rank.streak.batch.enabled=false
contest.submission.judge.rabbit.publisher.enabled=false
contest.submission.judge.rabbit.listener.enabled=false

# The backlog of a shared table is a property of the table, not of the process reading it. Five
# instances polling would run the same query five times and publish five identical series, and
# summing across instances - right for every other application metric here - would then report
# five times the real backlog. batch-1 owns both drains, so it does the reading.
contest.outbox.metrics.enabled=false
