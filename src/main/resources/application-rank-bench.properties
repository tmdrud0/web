# Dedicated database for reusable rank benchmark datasets.
spring.datasource.url=jdbc:mysql://localhost:3306/oj_rank_bench?rewriteBatchedStatements=true&cachePrepStmts=true
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.jpa.open-in-view=false

# Keep rank benchmark runs quiet and deterministic.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# Rank benchmarks do not need external infra side effects.
contest.scoreboard.store=memory
contest.submission.dedup.store=memory
contest.submission.rate-limit.store=none
