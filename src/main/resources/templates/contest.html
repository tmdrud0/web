<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${contest.name} + ' - Contest'">Contest Detail</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f8f9fa; }
        .container { padding: 24px 32px; }
        .contest-header { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        .contest-title { display: flex; align-items: center; gap: 12px; }
        .badge { display: inline-block; padding: 6px 12px; border-radius: 16px; font-size: 13px; font-weight: 600; color: #fff; }
        .badge.UPCOMING { background: #6c757d; }
        .badge.RUNNING { background: #28a745; }
        .badge.ENDED { background: #dc3545; }
        .time-meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; color: #495057; }
        .time-highlight { font-weight: 600; color: #343a40; }
        .tab-nav { display: flex; gap: 12px; margin-bottom: 16px; }
        .tab-link { text-decoration: none; padding: 10px 18px; border-radius: 20px; font-size: 14px; font-weight: 600; color: #495057; background: #e9ecef; transition: background 0.2s ease, color 0.2s ease; }
        .tab-link.active { background: #0d6efd; color: #fff; }
        .panel { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 10px 12px; text-align: center; font-size: 14px; }
        thead { background: #f1f3f5; }
        tbody tr:nth-child(odd) { background: #f8f9fa; }
        tbody tr:hover { background: #eef2ff; }
        .empty-state { text-align: center; padding: 24px; color: #6c757d; }
        .link-button { text-decoration: none; color: #0d6efd; font-weight: 600; }
    </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<div class="container">
    <div class="contest-header">
        <div class="contest-title">
            <span class="badge" th:classappend=" ${status}" th:text="${statusLabel}">Status</span>
            <h2 th:text="${contest.name}">Contest Name</h2>
        </div>
        <div class="time-meta">
            <span>Start: <span class="time-highlight" th:text="${#temporals.format(contest.startTime, 'yyyy-MM-dd HH:mm')}">Start</span></span>
            <span>End: <span class="time-highlight" th:text="${#temporals.format(contest.endTime, 'yyyy-MM-dd HH:mm')}">End</span></span>
            <span th:text="${timeMessage}">Time message</span>
        </div>
    </div>

    <div class="tab-nav">
        <a th:href="@{'/contests/' + ${contest.id} + '?tab=problems'}" th:class="${activeTab} == 'problems' ? 'tab-link active' : 'tab-link'">Problems</a>
        <a th:href="@{'/contests/' + ${contest.id} + '?tab=scoreboard'}" th:class="${activeTab} == 'scoreboard' ? 'tab-link active' : 'tab-link'">Scoreboard</a>
    </div>

    <div class="panel" th:if="${activeTab} == 'problems'">
        <h3>Problem Set</h3>
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>Problem</th>
                <th>Solved Count</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="problem : ${contest.problems}">
                <td>
                    <a class="link-button" th:href="@{'/problem/' + ${problem.id}}" th:text="${problem.contestNum}">A</a>
                </td>
                <td th:text="${problem.name}">Problem Name</td>
                <td th:text="${problem.solvedNum}">0</td>
            </tr>
            </tbody>
        </table>
        <div class="empty-state" th:if="${#lists.isEmpty(contest.problems)}">
            No problems are registered for this contest yet.
        </div>
    </div>

    <div class="panel" th:if="${activeTab} == 'scoreboard'">
        <h3>Live Scoreboard</h3>
        <div class="empty-state" th:if="${!hasScoreboard}">
            Scoreboard data will appear once submissions are judged.
        </div>
        <table th:if="${hasScoreboard}">
            <thead>
            <tr>
                <th>Rank</th>
                <th>Participant</th>
                <th>Solved</th>
                <th>Penalty</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${scoreboardRows}">
                <td th:text="${row.rank()}">1</td>
                <td th:text="${row.userName()}">User</td>
                <td th:text="${row.solvedCount()}">0</td>
                <td th:text="${row.penalty()} + ' min'"><span>0</span></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
