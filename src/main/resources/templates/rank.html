<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Rankings</title>
  <style>
    table { border-collapse: collapse; width: 100%; }
    table, th, td { border: 1px solid #ccc; }
    th, td { padding: 8px; text-align: center; }
    .paging { margin-top: 15px; }
    .sort-links a { margin: 0 10px; text-decoration: none; color: #007bff; }
    .active { font-weight: bold; }
    .page-links a { margin: 0 4px; text-decoration: none; }
    .page-links span.current { font-weight: bold; }
  </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div style="padding: 20px;">
  <h2>User Rankings</h2>

  <div class="sort-links">
    <span>Sort By:</span>
    <a th:href="@{/rank(sortBy='solvedCount', size=${pageSize})}"
       th:classappend="${sortBy=='solvedCount'} ? ' active'">Solved Problems</a>
    <a th:href="@{/rank(sortBy='streak', size=${pageSize})}"
       th:classappend="${sortBy=='streak'} ? ' active'">Current Streak</a>
    <a th:href="@{/rank(sortBy='longest', size=${pageSize})}"
       th:classappend="${sortBy=='longest'} ? ' active'">Longest Streak</a>
    <span th:if="${sortBy=='solvedCount'}">| <a th:href="@{/rank(sortBy='solvedCount', aroundMe=true, size=${pageSize})}">Go to My Rank</a></span>
    <span th:if="${sortBy=='streak'}">| <a th:href="@{/rank(sortBy='streak', aroundMe=true, size=${pageSize})}">Go to My Rank</a></span>
    <span th:if="${sortBy=='longest'}">| <a th:href="@{/rank(sortBy='longest', aroundMe=true, size=${pageSize})}">Go to My Rank</a></span>
  </div>

  <div th:if="${sortBy=='solvedCount'}" th:with="page=${pageResult}">
    <div th:replace="this ::rankTable(${page}, ${sortBy}, ${aroundMe}, 'Solved Problems')"></div>
  </div>

  <div th:if="${sortBy=='streak'}" th:with="page=${streakPageResult}">
    <div th:replace="this ::rankTable(${page}, ${sortBy}, ${aroundMe}, 'Current Streak')"></div>
  </div>

  <div th:if="${sortBy=='longest'}" th:with="page=${longestPageResult}">
    <div th:replace="this ::rankTable(${page}, ${sortBy}, ${aroundMe}, 'Longest Streak')"></div>
  </div>
</div>

<th:block th:fragment="rankTable(page, sortKey, aroundMe, metricHeader)">
  <div th:if="${page} != null">
    <div style="margin: 10px 0;">
      <span th:if="${page.myRank()} > 0" th:text="'Your Rank: ' + ${page.myRank()}"></span>
      <span th:text="' | Page starts at: ' + ${page.pageStartRank()}"></span>
      <span th:text="' | Total users: ' + ${page.totalItems()}"></span>
    </div>

    <table>
      <thead>
      <tr>
        <th>Rank</th>
        <th>User ID</th>
        <th>Username</th>
        <th th:text="${metricHeader}">Metric</th>
        <th>Last Solved At</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="item : ${page.items()}">
        <td th:text="${item.rank()}">1</td>
        <td th:text="${item.userId()}">ID</td>
        <td th:text="${item.name()}">Username</td>
        <td th:text="${item.solvedCount()}">0</td>
        <td th:text="${item.lastSolvedTime() != null ? #temporals.format(item.lastSolvedTime(), 'yyyy-MM-dd HH:mm') : '-'}">-</td>
      </tr>
      <tr th:if="${page.items().isEmpty()}">
        <td colspan="5">No data available.</td>
      </tr>
      </tbody>
    </table>

    <div class="paging" th:if="${page.totalItems() > 0}">
      <div class="page-links"
           th:with="totalPages=${T(java.lang.Math).max(1L, (page.totalItems() + page.pageSize() - 1) / page.pageSize())},
                    currentPage=${T(java.lang.Math).max(1L, (page.pageStartRank() - 1) / page.pageSize() + 1)},
                    startPage=${T(java.lang.Math).max(1L, currentPage - 2)},
                    endPage=${T(java.lang.Math).min(totalPages, currentPage + 2)}">
        <a th:if="${page.previousCursor() != null}"
           th:href="@{/rank(sortBy=${sortKey}, cursor=${page.previousCursor()}, size=${page.pageSize()}, aroundMe=${aroundMe})}">Prev</a>
        <span th:unless="${page.previousCursor() != null}">Prev</span>

        <span th:each="p : ${#numbers.sequence(startPage, endPage)}">
          <a th:if="${p != currentPage}"
             th:href="@{/rank(sortBy=${sortKey}, cursor=${(p - 1) * page.pageSize() + 1}, size=${page.pageSize()}, aroundMe=${aroundMe})}"
             th:text="${p}"></a>
          <span th:if="${p == currentPage}" class="current" th:text="${p}"></span>
        </span>

        <a th:if="${page.nextCursor() != null}"
           th:href="@{/rank(sortBy=${sortKey}, cursor=${page.nextCursor()}, size=${page.pageSize()}, aroundMe=${aroundMe})}">Next</a>
        <span th:unless="${page.nextCursor() != null}">Next</span>
      </div>
    </div>
  </div>
</th:block>
</body>
</html>
