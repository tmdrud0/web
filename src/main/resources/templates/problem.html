<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Problem Details</title>
  <style>
    .container {
      display: flex;
    }
    .left, .right {
      padding: 20px;
    }
    .left {
      flex: 2;
    }
    .right {
      flex: 1;
      border-left: 1px solid #ccc;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    table, th, td {
      border: 1px solid #ccc;
    }
    th, td {
      padding: 8px;
      text-align: center;
    }
    .button {
      text-decoration: none;
      background-color: #007bff;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      margin-top: 10px;
      display: inline-block;
    }
  </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>

<div class="container">
  <div class="left">
    <h2>Problem Detail</h2>
    <p>ID: <span th:text="${problem.id}">ID</span></p>
    <p>Name: <span th:text="${problem.name}">Name</span></p>
    <p>Contest: <span th:text="${problem.contestName}">Contest</span></p>

    <h3>Submit Solution</h3>
    <form th:action="@{'/problems/' + ${problem.id} + '/submission'}" method="post">
      <textarea name="code" placeholder="Enter your C++ code here" rows="10" style="width:100%;"></textarea>
      <br>
      <button type="submit" class="button">Submit</button>
    </form>
  </div>

  <div class="right">
    <h3>Your Submissions</h3>
    <table>
      <thead>
      <tr>
        <th>Submission ID</th>
        <th>Time</th>
        <th>Result</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="submission : ${problem.userSubmissions}">
        <td>
          <a th:href="@{'/submission/' + ${submission.id}}"
             th:text="${submission.id}">ID</a>
        </td>
        <td th:text="${#temporals.format(submission.submittedTime, 'yyyy-MM-dd HH:mm:ss')}">Time</td>
        <td th:text="${submission.result}">Result</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<div id="error-message" th:if="${error}" th:text="${error}" style="display:none;"></div>
<div id="info-message" th:if="${message}" th:text="${message}" style="display:none;"></div>

<script>
  window.addEventListener("DOMContentLoaded", function () {
    const errorMessage = document.getElementById("error-message")?.textContent?.trim();
    if (errorMessage) {
      alert(errorMessage);
    }
    const infoMessage = document.getElementById("info-message")?.textContent?.trim();
    if (infoMessage) {
      alert(infoMessage);
    }
  });
</script>

</body>
</html>
