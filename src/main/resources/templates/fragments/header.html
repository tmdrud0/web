<!-- fragments/header.html -->
<div th:fragment="header" style="background-color: #F8F8F8; border-bottom: 2px solid #CCC;"
     xmlns:th="http://www.w3.org/1999/xhtml">
  <div style="width: 80%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 10px 0;">
    <!-- 좌측 로고 영역 (클릭 시 홈 또는 프로필로 이동) -->
    <div>
      <a th:href="@{/}" style="text-decoration: none; color: #333; font-size: 24px; font-weight: bold;">
        Online Judge
      </a>
    </div>
    <!-- 중앙 메뉴 바 -->
    <nav>
      <ul style="display: flex; list-style: none; margin: 0; padding: 0;">
        <li style="margin-right: 15px;">
          <a href="/problems" style="text-decoration: none; color: #333;">PROBLEMS</a>
        </li>
        <li style="margin-right: 15px;">
          <a href="/contests" style="text-decoration: none; color: #333;">CONTESTS</a>
        </li>
        <li style="margin-right: 15px;">
          <a href="/submissions" style="text-decoration: none; color: #333;">SUBMISSIONS</a>
        </li>
        <li style="margin-right: 15px;">
          <a href="/rank" style="text-decoration: none; color: #333;">RANK</a>
        </li>
      </ul>
    </nav>
    <!-- 우측: 로그인/프로필, 로그아웃, 회원가입 -->
    <div>
      <span th:if="${session.user != null}">
        <!-- 사용자가 로그인되어 있으면 자신의 프로필 페이지로 이동 -->
        <a th:href="@{'/profile/' + ${session.user.id}}"
           th:text="'Welcome, ' + ${session.user.name}">My Profile</a>
        <a th:href="@{/logout}" style="margin-left: 10px;">Logout</a>
      </span>
      <span th:if="${session.user == null}">
        <a th:href="@{/login}" style="margin-right: 10px;">Login</a>
        <a th:href="@{/register}">Register</a>
      </span>
    </div>
  </div>
</div>
