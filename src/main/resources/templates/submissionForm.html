<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Submit Solution</title>
  <style>
    textarea {
        width: 100%;
        height: 300px;
        font-family: 'Courier New', Courier, monospace;
        font-size: 14px;
    }
  </style>
</head>
<body>
<div th:replace="fragments/header :: header"></div>
<h2 th:text="'Submit Solution for Problem: ' + ${problem.contestName} + ' ' + ${problem.contestNum}">Submit</h2>
<form th:action="@{'/problems/' + ${problem.id} + '/submission'}" method="post">
  <div>
    <label for="code">C++ Code:</label>
  </div>
  <div>
    <textarea id="code" name="code" placeholder="Enter your C++ code here"></textarea>
  </div>
  <div>
    <button type="submit">Submit</button>
  </div>
</form>
<a th:href="@{/problems}">Back to Problems</a>
</body>
</html>
