<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <style>
    .profile { padding: 20px; }
    .streak-info { margin-top: 15px; padding: 10px; border: 1px solid #ccc; }
  </style>
</head>
<body>
<!-- 공통 헤더 삽입 -->
<div th:replace="fragments/header :: header"></div>

<div class="profile">
  <h2>User Profile</h2>
  <p><strong>Username:</strong> <span th:text="${profileUser.name}">Username</span></p>
  <p><strong>Solved Count:</strong> <span th:text="${profileUser.solvedCount}">Solved Count</span></p>

  <div class="streak-info">
    <h3>Streak Information</h3>
    <p><strong>Last Solved Date:</strong>
      <span th:text="${profileUser.streak.lastSolvedDate}">Last Solved Date</span>
    </p>
    <p><strong>Current Streak:</strong>
      <span th:text="${profileUser.streak.currentStreak}">Current Streak</span>
    </p>
    <p><strong>Longest Streak:</strong>
      <span th:text="${profileUser.streak.longestStreak}">Longest Streak</span>
    </p>
  </div>
</div>
</body>
</html>
