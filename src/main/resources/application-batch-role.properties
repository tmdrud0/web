contest.outbox.scheduler.enabled=true
rank.streak.batch.enabled=true
contest.submission.judge.rabbit.publisher.enabled=true
contest.submission.judge.rabbit.listener.enabled=false
contest.submission.judge.result-stream.publisher.enabled=false
contest.scoreboard.stream.consumer.enabled=true
# This is the instance that consumes the scoreboard stream, so it is the recovery owner. Declared
# rather than left to the default so the deployment's assumption is visible in the file that decides
# it: every gate in the recovery package is JVM-local, and a second instance with the same settings
# would run the same passes alongside this one. See docs/ARCHITECTURE.md 3.5.
contest.scoreboard.recovery.owner.enabled=true
# Business HTTP stays closed, but this role owns the outbox relay and scoreboard stream
# consumer, so its pipeline metrics are the ones we most need to scrape. `web-application-type=none`
# starts no servlet container at all, which also removes the Actuator HTTP endpoint.
# `server.port=-1` keeps the servlet context so the management child context can start,
# while the business connector is never bound. The role contract is unchanged: no
# business port is served here.
server.port=-1
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=oj-batch-scheduling-
contest.scoreboard.redis.metrics.wrong-fields.enabled=true
contest.outbox.poll-interval-ms=200
contest.submission.judge.rabbit.publisher.batch-size=500
contest.submission.judge.rabbit.publisher.poll-interval-ms=100
