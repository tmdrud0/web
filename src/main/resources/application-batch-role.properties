contest.outbox.scheduler.enabled=true
rank.streak.batch.enabled=true
contest.submission.judge.rabbit.publisher.enabled=true
contest.submission.judge.rabbit.listener.enabled=false
# Business HTTP stays closed, but this role owns the outbox relay and the scoreboard
# worker, so its backlog metrics are the ones we most need to scrape. `web-application-type=none`
# starts no servlet container at all, which also removes the Actuator HTTP endpoint.
# `server.port=-1` keeps the servlet context so the management child context can start,
# while the business connector is never bound. The role contract is unchanged: no
# business port is served here.
server.port=-1
spring.task.scheduling.pool.size=4
spring.task.scheduling.thread-name-prefix=oj-batch-scheduling-
contest.outbox.poll-interval-ms=200
contest.outbox.batch-size=500
contest.outbox.claim-timeout=30s
contest.outbox.recovery-batch-size=10
contest.outbox.recovery-interval-ms=5000
contest.submission.judge.rabbit.publisher.batch-size=500
contest.submission.judge.rabbit.publisher.poll-interval-ms=100
