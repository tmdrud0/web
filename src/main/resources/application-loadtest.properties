# Shared-state settings for the isolated Compose load-test stack.
# Role profiles still decide which node relays to RabbitMQ or consumes from it.
# This overrides application-perf.properties, whose standalone benchmark URL is
# intentionally localhost/oj_perf rather than the Compose database.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:oj_loadtest}?rewriteBatchedStatements=true&cachePrepStmts=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:1234}
contest.scoreboard.store=redis
contest.submission.dedup.store=redis
# Capacity tests use many submissions per synthetic user. Keep the real Redis
# dedup path, but do not mix the product's per-user cooldown into server RPS.
contest.submission.rate-limit.store=none
contest.submission.id.strategy=snowflake
spring.session.store-type=redis

# Keep load-test logs focused on application failures rather than SQL output.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO

# The judge stub returns immediately, so every latency measured before this carried a judge cost
# of zero. Pipeline history 9.3 asks for a mean near 10ms with p99/p999 near 2s; that shape is
# what occupies listener threads, and it is off by default so existing baselines stay comparable.
# Override per run with JUDGE_LATENCY_ENABLED / JUDGE_SLOW_RATIO / JUDGE_SLOW_MILLIS.
contest.submission.judge.latency.enabled=${JUDGE_LATENCY_ENABLED:false}
contest.submission.judge.latency.slow-ratio=${JUDGE_SLOW_RATIO:0.01}
contest.submission.judge.latency.slow-millis=${JUDGE_SLOW_MILLIS:2000}
contest.submission.judge.latency.base-millis=${JUDGE_BASE_MILLIS:10}
