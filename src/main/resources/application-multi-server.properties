contest.scoreboard.store=redis
contest.submission.dedup.store=redis
contest.submission.rate-limit.store=redis
contest.submission.id.strategy=snowflake
spring.session.store-type=redis
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=20
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# The management port lives in application.properties, not here: batch-role and
# judge-role carry server.port=-1 independently of this profile, and only a global
# default follows them into every profile combination. A second copy here would be free
# to drift from it.
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
