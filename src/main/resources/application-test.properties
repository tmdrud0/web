# Dedicated MySQL DB for tests
spring.datasource.url=jdbc:mysql://localhost:3306/oj_test
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.test.database.replace=NONE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.flyway.enabled=true

# Allow cleaning in tests if you invoke it manually
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true

# Tests do not run a broker; keep both ends of the judge pipeline off.
contest.submission.judge.rabbit.publisher.enabled=false
contest.submission.judge.rabbit.listener.enabled=false

# Tests do not run Redis either. Without this, SessionRepositoryFilter wraps every
# request and looks sessions up by SESSION cookie, so MockMvc's sessionAttr() is
# invisible to controllers and authenticated requests redirect to /login.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

# Exercise the write paths that production actually uses. The redis-backed
# axes (scoreboard/dedup/rate-limit stores) still run in-memory here; those
# need a container to align.
contest.submission.bulk.persistence-mode=jdbc
contest.submission.judge.result-writer.mode=batch

# Quieter logs for CI/test runs
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
