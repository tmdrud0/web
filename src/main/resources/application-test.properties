# Dedicated MySQL DB for tests.
#
# The defaults below describe the long-running local instance this repository has been tested
# against; they are not a recommendation. That container is known to have been compromised (see
# docs/ENVIRONMENT.md §8.1), so a safe instance is pointed at with the TEST_DB_* variables instead
# of by editing this file - no credential belongs in a committed file.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/oj_test}
spring.datasource.username=${TEST_DB_USERNAME:root}
spring.datasource.password=${TEST_DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.test.database.replace=NONE
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.flyway.enabled=true

# Allow cleaning in tests if you invoke it manually
spring.flyway.clean-disabled=false
spring.flyway.clean-on-validation-error=true

# Tests do not run a broker; keep both ends of the judge pipeline off.
contest.submission.judge.rabbit.publisher.enabled=false
contest.submission.judge.rabbit.listener.enabled=false
contest.submission.judge.result-stream.publisher.enabled=false
contest.scoreboard.stream.consumer.enabled=false
# No recovery pass runs in a test context, so no context claims the owner role. Declared so that a
# test which turns the consumer on has to say so explicitly rather than inheriting it.
contest.scoreboard.recovery.owner.enabled=false

# The remaining judge-outbox backlog poller only reads, but cached Spring test contexts otherwise
# keep querying MySQL for the rest of the JVM. Its tests call poll() directly.
contest.outbox.metrics.enabled=false

# Tests do not run Redis either. Without this, SessionRepositoryFilter wraps every
# request and looks sessions up by SESSION cookie, so MockMvc's sessionAttr() is
# invisible to controllers and authenticated requests redirect to /login.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration

# No management server in tests. Nothing scrapes it, and a fixed port would collide
# between cached test contexts.
management.server.port=-1

# Quieter logs for CI/test runs
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql=WARN
