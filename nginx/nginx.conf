# `auto` reads the host's CPU count, not the cgroup's. On the 12-CPU WSL VM it started twelve
# workers inside a container limited to 0.25 CPU and 128M, each carrying its own 8192-slot
# connection table. That survived as long as the load generator opened a fresh connection per
# request and exhausted its own ports first; once Gatling shared connections and the 2000 RPS
# read stream stayed open, nginx was OOM-killed at peak and every request after it read as
# Connection refused. Same blind spot the JVMs have - a process cannot see its own limit - which
# is why CgroupResourceMetrics exists. Pinned to match the CPU share instead.
worker_processes 1;

events {
    # A proxied request in flight holds two slots, its client connection and its upstream one, so
    # this table is spent at half its size. submit-1000 measured that: 5,000 sessions each waiting
    # on a 15-second response needed 10,000 slots, and nginx logged "8192 worker_connections are
    # not enough" 1,143 times while dropping 8,246 requests. One worker at that load used 8MB of
    # its 128M, so the ceiling was the count rather than the memory - the twelve-worker version
    # that was OOM-killed paid for twelve of these tables, not one large one.
    worker_connections 16384;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # The application refuses work it cannot queue - a bounded in-flight semaphore answering 503
    # with Retry-After - and nginx had no equivalent for its own connection table, so the edge
    # collapsed before that backpressure could ever fire. Measured on submit-1000: zero 503s from
    # the application, 8,246 connections dropped at nginx. A dropped connection is the worst answer
    # available here, because a submission may well have been accepted before it was cut and the
    # client cannot tell; deduplication only covers a retry of byte-identical code, so a user who
    # edits and resubmits is judged twice.
    #
    # 3,000 comes from the same run: the web tier accepted about 600 submissions a second, so this
    # is five seconds of queue. Past that, holding a request is worse for the caller than refusing
    # it, and it leaves the table far enough clear that dropping is not how the limit is reached.
    # Keyed on a constant so the limit is global rather than per-client - the resource being
    # protected is one table shared by everyone.
    limit_conn_zone $server_name zone=proxied:1m;
    limit_conn_status 503;

    upstream oj_web {
        server web-1:8080 max_fails=0;
        server web-2:8080 max_fails=0;
        keepalive 256;
    }

    server {
        listen 80;
        server_name _;

        location / {
            limit_conn proxied 3000;
            proxy_pass http://oj_web;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 1s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            # 503 is deliberately not retried. It is the only status here the application chooses
            # to send: the admission limiter refusing work it cannot queue. Retrying it moved that
            # request to the other instance at the moment the system was asking for less, so a
            # backpressure signal became a load multiplier and the caller still ended up with 503
            # after both instances had paid for it. 502 and 504 stay, because those say an instance
            # is unwell and its sibling may not be.
            proxy_next_upstream error timeout invalid_header http_502 http_504;
            proxy_next_upstream_tries 2;
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }

    # Metrics only. Not published to the host, so this is reachable from the
    # exporter inside the compose network and not from the public 8080 path.
    server {
        listen 8090;
        server_name _;

        location /stub_status {
            stub_status;
            access_log off;
        }
    }
}
